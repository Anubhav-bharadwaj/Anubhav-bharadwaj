<svg viewBox="0 0 420 360" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bodyGrad" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#fdfdfd"/>
      <stop offset="100%" stop-color="#dfe3e8"/>
    </radialGradient>
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b2733"/>
      <stop offset="100%" stop-color="#0d151d"/>
    </linearGradient>
  </defs>

  <!-- Everything floats gently -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0,0; 0,-10; 0,0" dur="3s" repeatCount="indefinite" calcMode="spline"
      keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>

    <!-- soft shadow -->
    <ellipse cx="210" cy="330" rx="70" ry="10" fill="#000" opacity="0.15">
      <animate attributeName="rx" values="70;58;70" dur="3s" repeatCount="indefinite"/>
    </ellipse>

    <!-- speech bubble -->
    <g>
      <rect x="30" y="10" width="330" height="90" rx="18" fill="#161b22" stroke="#30363d" stroke-width="2"/>
      <path d="M120 100 L100 130 L150 100 Z" fill="#161b22" stroke="#30363d" stroke-width="2"/>
      <text x="52" y="42" font-family="Segoe UI, Verdana, sans-serif" font-size="17" font-weight="700" fill="#f0f6fc">Hey, I'm Anubhav's bot 🤖</text>
      <text x="52" y="66" font-family="Segoe UI, Verdana, sans-serif" font-size="14" fill="#c9d1d9">Scroll around — I'll just be over here</text>
      <text x="52" y="86" font-family="Segoe UI, Verdana, sans-serif" font-size="14" fill="#c9d1d9">if you need anything 👋</text>
    </g>

    <!-- antenna -->
    <line x1="210" y1="150" x2="210" y2="128" stroke="#8a94a6" stroke-width="4" stroke-linecap="round"/>
    <circle cx="210" cy="122" r="7" fill="#ff5c5c">
      <animate attributeName="opacity" values="1;0.4;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>

    <!-- head -->
    <rect x="130" y="150" width="160" height="110" rx="30" fill="url(#bodyGrad)" stroke="#b8bfc9" stroke-width="2"/>
    <!-- visor -->
    <rect x="150" y="175" width="120" height="55" rx="20" fill="url(#visorGrad)"/>
    <circle cx="188" cy="202" r="11" fill="#57c7ff">
      <animate attributeName="cy" values="202;200;202" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="232" cy="202" r="11" fill="#57c7ff">
      <animate attributeName="cy" values="202;200;202" dur="3s" repeatCount="indefinite"/>
    </circle>

    <!-- body -->
    <rect x="145" y="255" width="130" height="85" rx="24" fill="url(#bodyGrad)" stroke="#b8bfc9" stroke-width="2"/>
    <circle cx="210" cy="297" r="10" fill="#ff5c5c"/>

    <!-- left arm, waving -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="0 150 268; -25 150 268; 0 150 268; -25 150 268; 0 150 268"
        dur="1.8s" repeatCount="indefinite"/>
      <rect x="118" y="260" width="34" height="16" rx="8" fill="url(#bodyGrad)" stroke="#b8bfc9" stroke-width="2"/>
      <circle cx="118" cy="268" r="12" fill="#e7ebef" stroke="#b8bfc9" stroke-width="2"/>
    </g>

    <!-- right arm, resting -->
    <rect x="268" y="270" width="34" height="16" rx="8" fill="url(#bodyGrad)" stroke="#b8bfc9" stroke-width="2"/>
    <circle cx="302" cy="278" r="12" fill="#e7ebef" stroke="#b8bfc9" stroke-width="2"/>
  </g>
</svg>
